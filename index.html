function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i=0;i<text.length;i++) {
    const c = text[i], next = text[i+1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\r') { }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
      else { field += c; }
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || r[0] !== "");
}

function toObjects(rows) {
  const headers = rows[0];
  return rows.slice(1).map(r => {
    const o = {};
    headers.forEach((h,i) => o[h] = r[i] !== undefined ? r[i] : "");
    return o;
  });
}

function stars(n) {
  const v = parseFloat(n) || 0;
  const full = Math.floor(v);
  const half = v - full >= 0.5;
  let s = "";
  for (let i=0;i<full;i++) s += "★";
  if (half) s += "½";
  return s + " (" + (v || "n/d") + ")";
}

function euros(n) {
  const v = parseFloat(n);
  if (isNaN(v)) return n || "n/d";
  return v.toLocaleString("pt-PT") + " €";
}

function extractGPS(field) {
  if (!field || field.toLowerCase().indexOf("não confirmado") === 0 || field.toLowerCase().indexOf("nao confirmado") === 0) return null;
  const m = field.match(/(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,2}\.\d{3,})/);
  if (!m) return null;
  return { lat: m[1], lng: m[2] };
}

function computeDiffs(current) {
  let prev = null;
  try { prev = JSON.parse(localStorage.getItem(SNAPSHOT_KEY) || "null"); } catch(e) {}
  const diffs = [];
  if (prev && prev.items) {
    const prevMap = {};
    prev.items.forEach(p => prevMap[p.ID] = p);
    current.forEach(c => {
      const p = prevMap[c.ID];
      if (!p) { diffs.push({type:"novo", item:c}); }
      else {
        if (p.Preco_EUR !== c.Preco_EUR) diffs.push({type:"preco", item:c, de:p.Preco_EUR, para:c.Preco_EUR});
        if (p.Avaliacao_Global_estrelas !== c.Avaliacao_Global_estrelas) diffs.push({type:"estrelas", item:c, de:p.Avaliacao_Global_estrelas, para:c.Avaliacao_Global_estrelas});
      }
    });
  }
  localStorage.setItem(SNAPSHOT_KEY, JSON.stringify({ savedAt: new Date().toISOString(), items: current.map(c=>({ID:c.ID,Preco_EUR:c.Preco_EUR,Avaliacao_Global_estrelas:c.Avaliacao_Global_estrelas})) }));
  return { diffs, isFirstVisit: !prev };
}

function statCard(label, value) {
  return '<div style="background:#f6f6f4;border-radius:10px;padding:10px 16px;min-width:140px;">'
    +'<div style="font-size:12px;color:#777;">'+label+'</div>'
    +'<div style="font-size:20px;font-weight:600;">'+value+'</div></div>';
}

let LIGHTBOX_PHOTOS = [];
let LIGHTBOX_IDX = 0;

function openLightbox(photos, idx) {
  LIGHTBOX_PHOTOS = photos;
  LIGHTBOX_IDX = idx;
  document.getElementById("lightbox").style.display = "flex";
  renderLightbox();
}
function renderLightbox() {
  document.getElementById("lb-img").src = LIGHTBOX_PHOTOS[LIGHTBOX_IDX];
  document.getElementById("lb-count").textContent = (LIGHTBOX_IDX+1) + " / " + LIGHTBOX_PHOTOS.length;
}
function closeLightbox() { document.getElementById("lightbox").style.display = "none"; }

document.getElementById("lb-close").onclick = closeLightbox;
document.getElementById("lightbox").addEventListener("click", (e) => { if (e.target.id === "lightbox") closeLightbox(); });
document.getElementById("lb-prev").onclick = (e) => { e.stopPropagation(); LIGHTBOX_IDX = (LIGHTBOX_IDX - 1 + LIGHTBOX_PHOTOS.length) % LIGHTBOX_PHOTOS.length; renderLightbox(); };
document.getElementById("lb-next").onclick = (e) => { e.stopPropagation(); LIGHTBOX_IDX = (LIGHTBOX_IDX + 1) % LIGHTBOX_PHOTOS.length; renderLightbox(); };
document.addEventListener("keydown", (e) => {
  if (document.getElementById("lightbox").style.display !== "flex") return;
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowLeft") document.getElementById("lb-prev").click();
  if (e.key === "ArrowRight") document.getElementById("lb-next").click();
});

function propRow(p) {
  const photos = PHOTOS[p.ID];
  const hasPhoto = photos && photos.p;
  const gallery = (photos && photos.g && photos.g.length) ? photos.g : (hasPhoto ? [photos.p] : []);
  const photoHtml = hasPhoto
    ? '<img src="'+photos.p+'" loading="lazy" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentElement.innerHTML=\'<div style=&quot;width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:11px;text-align:center;padding:4px;&quot;>sem foto</div>\';">'
    : '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:11px;text-align:center;padding:4px;">sem foto</div>';

  const row = document.createElement("div");
  row.className = "prop-row";
  row.style.cssText = "display:flex;gap:14px;background:#fff;border:1px solid #e3e3e3;border-radius:10px;padding:10px;margin-bottom:10px;cursor:pointer;align-items:stretch;";
  row.onclick = () => { if (p.Link && p.Link.indexOf("http") === 0) window.open(p.Link, "_blank"); };

  const photoDiv = document.createElement("div");
  photoDiv.className = "prop-photo";
  photoDiv.style.cssText = "width:150px;min-width:150px;height:110px;border-radius:8px;overflow:hidden;background:#eee;flex-shrink:0;";
  photoDiv.innerHTML = photoHtml;
  if (gallery.length) {
    photoDiv.style.cursor = "zoom-in";
    photoDiv.onclick = (e) => { e.stopPropagation(); openLightbox(gallery, 0); };
  }
  row.appendChild(photoDiv);

  const info = document.createElement("div");
  info.style.cssText = "flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px;";
  info.innerHTML =
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;">'
      +'<div style="font-weight:600;font-size:15px;">'+p.Rank+'. '+p.Localidade+'</div>'
      +'<div style="font-weight:600;white-space:nowrap;">'+euros(p.Preco_EUR)+'</div>'
    +'</div>'
    +'<div style="font-size:12px;color:#777;">'+p.Concelho+', '+p.Distrito
      +' · '+(p.Area_m2 && !isNaN(parseFloat(p.Area_m2)) ? parseFloat(p.Area_m2).toLocaleString("pt-PT")+" m²" : "área n/d")+'</div>'
    +'<div style="font-size:13px;color:#b8860b;">'+stars(p.Avaliacao_Global_estrelas)+' avaliação global</div>'
    +'<div style="font-size:12px;color:#555;line-height:1.4;max-height:36px;overflow:hidden;">'+(p.Tipo_Vista||'')+'</div>';
  row.appendChild(info);

  return row;
}

function render(items) {
  document.getElementById("loading").style.display = "none";
  document.getElementById("subtitle").textContent = items.length + " propriedades — Norte de Portugal";
  const content = document.getElementById("content");
  content.style.display = "block";

  const { diffs, isFirstVisit } = computeDiffs(items);
  const gpsCount = items.filter(p => extractGPS(p.GPS)).length;
  const lastDate = items.map(p=>p.Data).sort().pop() || "n/d";

  let html = "";
  html += '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;">'
    + statCard("Propriedades", items.length)
    + statCard("GPS confirmado", gpsCount + " / " + items.length)
    + statCard("Última atualização", lastDate)
    + '</div>';

  if (diffs.length && !isFirstVisit) {
    html += '<div style="background:#fff8e1;border:1px solid #f0dfa0;border-radius:10px;padding:12px 16px;margin-bottom:18px;">';
    html += '<div style="font-weight:600;font-size:13px;margin-bottom:6px;color:#7a5c00;">Novidades desde a última visita</div>';
    diffs.forEach(d => {
      if (d.type==="novo") html += '<div style="font-size:12px;color:#555;">• Novo: '+d.item.Localidade+' ('+euros(d.item.Preco_EUR)+')</div>';
      if (d.type==="preco") html += '<div style="font-size:12px;color:#555;">• Preço alterado em '+d.item.Localidade+': '+euros(d.de)+' → '+euros(d.para)+'</div>';
      if (d.type==="estrelas") html += '<div style="font-size:12px;color:#555;">• Avaliação alterada em '+d.item.Localidade+': '+d.de+' → '+d.para+'</div>';
    });
    html += '</div>';
  } else if (isFirstVisit) {
    html += '<div style="background:#f2f7ff;border:1px solid #cfe0f2;border-radius:10px;padding:12px 16px;margin-bottom:18px;font-size:12px;color:#555;">Primeira visita neste dispositivo — a partir de agora comparo automaticamente cada vez que reabrir, e assinalo aqui novos anúncios, preços alterados ou avaliações alteradas.</div>';
  }

  html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">';
  html += '<select id="f-concelho" style="padding:6px 10px;border-radius:6px;border:1px solid #ccc;font-size:13px;"><option value="">Todos os concelhos</option></select>';
  html += '<input id="f-preco" type="number" placeholder="Preço máx (€)" style="padding:6px 10px;border-radius:6px;border:1px solid #ccc;font-size:13px;width:130px;">';
  html += '<select id="f-estrelas" style="padding:6px 10px;border-radius:6px;border:1px solid #ccc;font-size:13px;"><option value="0">Todas as estrelas</option><option value="3.5">≥ 3.5 ★</option><option value="4">≥ 4 ★</option></select>';
  html += '<label style="font-size:13px;display:flex;align-items:center;gap:4px;"><input id="f-ruina" type="checkbox"> só com ruína</label>';
  html += '<select id="f-sort" style="padding:6px 10px;border-radius:6px;border:1px solid #ccc;font-size:13px;margin-left:auto;">'
        + '<option value="rank">Ordenar: Rank</option>'
        + '<option value="preco">Ordenar: Preço</option>'
        + '<option value="estrelas">Ordenar: Avaliação</option>'
        + '</select>';
  html += '</div>';
  html += '<div id="list-wrap"></div>';

  content.innerHTML = html;

  const concelhos = [...new Set(items.map(p=>p.Concelho))].sort();
  const sel = document.getElementById("f-concelho");
  concelhos.forEach(c => { const o = document.createElement("option"); o.value=c; o.textContent=c; sel.appendChild(o); });

  function renderList() {
    const concelho = document.getElementById("f-concelho").value;
    const precoMax = parseFloat(document.getElementById("f-preco").value);
    const estrelasMin = parseFloat(document.getElementById("f-estrelas").value);
    const soRuina = document.getElementById("f-ruina").checked;
    const sortBy = document.getElementById("f-sort").value;

    let filtered = items.filter(p => {
      if (concelho && p.Concelho !== concelho) return false;
      if (!isNaN(precoMax) && parseFloat(p.Preco_EUR) > precoMax) return false;
      if (estrelasMin && (parseFloat(p.Avaliacao_Global_estrelas)||0) < estrelasMin) return false;
      if (soRuina && p.Ruina.toLowerCase().indexOf("sim") !== 0) return false;
      return true;
    });

    filtered.sort((a,b) => {
      if (sortBy === "preco") return (parseFloat(a.Preco_EUR)||0) - (parseFloat(b.Preco_EUR)||0);
      if (sortBy === "estrelas") return (parseFloat(b.Avaliacao_Global_estrelas)||0) - (parseFloat(a.Avaliacao_Global_estrelas)||0);
      const ra = parseFloat(a.Rank), rb = parseFloat(b.Rank);
      if (!isNaN(ra) && !isNaN(rb)) return ra - rb;
      if (isNaN(ra) && !isNaN(rb)) return 1;
      if (!isNaN(ra) && isNaN(rb)) return -1;
      return 0;
    });

    const wrap = document.getElementById("list-wrap");
    wrap.innerHTML = "";
    if (!filtered.length) {
      wrap.innerHTML = '<div style="padding:20px;text-align:center;color:#888;font-size:13px;">Sem resultados para estes filtros.</div>';
      return;
    }
    filtered.forEach(p => wrap.appendChild(propRow(p)));
  }

  document.getElementById("f-concelho").onchange = renderList;
  document.getElementById("f-preco").oninput = renderList;
  document.getElementById("f-estrelas").onchange = renderList;
  document.getElementById("f-ruina").onchange = renderList;
  document.getElementById("f-sort").onchange = renderList;

  renderList();
}

async function init() {
  try {
    const res = await fetch(CSV_URL + (CSV_URL.indexOf("?")>-1?"&":"?") + "cachebust=" + Date.now());
    if (!res.ok) throw new Error("HTTP " + res.status);
    const csvText = await res.text();
    const rows = parseCSV(csvText);
    const items = toObjects(rows);
    render(items);
  } catch (e) {
    document.getElementById("loading").innerHTML = "Não consegui carregar os dados da folha pública. Erro: " + (e && e.message ? e.message : e);
  }
}
init();
</script>
